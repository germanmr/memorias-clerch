<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Memorias y Ascendencia Clerch — Esteban Clerch Casals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f4ef;
      --surface: #fffcf8;
      --ink: #1c1917;
      --muted: #57534e;
      --accent: #7c2d3e;
      --accent-soft: #f5e8ec;
      --border: #e7e0d6;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Outfit", system-ui, sans-serif;
      --max: 42rem;
      --wide: 56rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--serif);
      font-size: 1.25rem;
      line-height: 1.75;
      color: var(--ink);
      background: var(--bg);
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    nav {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem 1.25rem 2rem;
      font-family: var(--sans);
      font-size: 0.82rem;
    }
    .lang-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }
    .lang-bar span { margin-right: 0.25rem; }
    .lang-bar button {
      font-family: var(--sans);
      font-size: 0.78rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-bar button:hover { border-color: var(--accent); color: var(--accent); }
    .lang-bar button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    nav h2 {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    nav a {
      display: block;
      color: var(--muted);
      text-decoration: none;
      padding: 0.35rem 0;
      border-left: 2px solid transparent;
      padding-left: 0.75rem;
      transition: color 0.2s, border-color 0.2s;
    }
    nav a:hover, nav a.active {
      color: var(--accent);
      border-left-color: var(--accent);
    }
    main { padding: 0 2rem 4rem; max-width: calc(var(--wide) + 4rem); }
    .hero {
      padding: 4rem 0 3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }
    .hero .eyebrow {
      font-family: var(--sans);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 3.75rem);
      font-weight: 600;
      line-height: 1.1;
      max-width: 18ch;
    }
    .hero .subtitle {
      margin-top: 1.25rem;
      font-size: 1.35rem;
      color: var(--muted);
      font-style: italic;
    }
    .hero .meta {
      margin-top: 2rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      color: var(--muted);
    }
    section {
      margin-bottom: 4rem;
      scroll-margin-top: 2rem;
    }
    section > h2 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }
    section > .lead {
      font-family: var(--sans);
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      max-width: var(--max);
    }
    .prose { max-width: var(--max); }
    .prose p { margin-bottom: 1.1rem; text-align: justify; hyphens: auto; }
    .prose h3 {
      font-size: 1.5rem;
      margin: 2rem 0 0.75rem;
      font-weight: 600;
    }
    .genealogy {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem 2rem;
      max-width: var(--wide);
      margin: 1.5rem 0;
      font-size: 1.05rem;
    }
    .genealogy ol { padding-left: 1.25rem; }
    .genealogy li { margin-bottom: 0.65rem; }
    .genealogy .gen-name { font-weight: 600; }
    .family-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      max-width: var(--wide);
      margin: 1.5rem 0;
    }
    .family-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.15rem;
      font-family: var(--sans);
      font-size: 0.88rem;
    }
    .family-card strong { display: block; color: var(--accent); margin-bottom: 0.25rem; }
    figure {
      margin: 2rem 0;
      max-width: var(--wide);
    }
    figure img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: zoom-in;
      background: #fff;
    }
    figcaption {
      font-family: var(--sans);
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.6rem;
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      max-width: var(--wide);
    }
    .gallery a {
      display: block;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 3/4;
      background: #fff;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery a:hover img { transform: scale(1.03); }
    .note {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      font-family: var(--sans);
      font-size: 0.9rem;
      border-radius: 0 8px 8px 0;
      max-width: var(--max);
    }
    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--muted);
      max-width: var(--max);
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal.open { display: flex; }
    .modal img { max-width: 95vw; max-height: 90vh; border-radius: 4px; }
    .modal button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        padding: 1rem;
      }
      .lang-bar { width: 100%; margin-bottom: 0.5rem; padding-bottom: 0.75rem; }
      nav h2 { width: 100%; margin-bottom: 0; }
      nav a { border: none; padding: 0.25rem 0; }
      main { padding: 0 1.25rem 3rem; }
    }
  </style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="lang-bar">
      <span id="lang-label">Idioma</span>
      <button type="button" data-lang="es" class="active" aria-pressed="true">Español</button>
      <button type="button" data-lang="ca" aria-pressed="false">Català</button>
    </div>
    <h2 id="nav-index">Índice</h2>
    <div id="nav-links"></div>
  </nav>

  <main>
    <header class="hero" id="intro">
      <p class="eyebrow" id="intro-eyebrow"></p>
      <h1 id="intro-h1"></h1>
      <p class="subtitle" id="intro-subtitle"></p>
      <p class="meta" id="intro-meta"></p>
    </header>
    <div id="sections-root"></div>
    <footer id="site-footer"></footer>
  </main>
</div>

<div class="modal" id="modal" role="dialog">
  <button type="button" id="modal-close" aria-label="Cerrar">&times;</button>
  <img src="" alt="">
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
