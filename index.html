<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Memorias y Ascendencia Clerch — Esteban Clerch Casals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #cfc6b8;
      --surface: #f3ede4;
      --surface-elevated: #faf6ef;
      --ink: #14100d;
      --muted: #3d3630;
      --muted-light: #5c534a;
      --accent: #5a1528;
      --accent-bright: #7a2238;
      --accent-soft: #d4b8c0;
      --accent-soft-bg: #ebe0e4;
      --border: #a89888;
      --border-strong: #7a6b5c;
      --nav-bg: #1c1713;
      --nav-text: #b8aea2;
      --nav-text-hover: #f0e8dc;
      --nav-border: #3d342c;
      --shadow-sm: 0 1px 3px rgba(20, 16, 13, 0.12);
      --shadow-md: 0 4px 16px rgba(20, 16, 13, 0.14);
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Outfit", system-ui, sans-serif;
      --max: 42rem;
      --wide: 56rem;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--serif);
      font-size: 1.25rem;
      line-height: 1.75;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    nav {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      background: var(--nav-bg);
      border-right: 1px solid var(--nav-border);
      padding: 1.25rem 1.25rem 2rem;
      font-family: var(--sans);
      font-size: 0.82rem;
      box-shadow: var(--shadow-md);
    }
    .lang-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--nav-border);
      font-size: 0.75rem;
      color: var(--nav-text);
      font-weight: 500;
    }
    .lang-bar span { margin-right: 0.25rem; color: #8a8078; }
    .lang-bar button {
      font-family: var(--sans);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: 1px solid #4a4038;
      background: #2a231e;
      color: var(--nav-text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-bar button:hover {
      border-color: var(--accent-soft);
      color: var(--nav-text-hover);
      background: #352c26;
    }
    .lang-bar button.active {
      background: var(--accent);
      border-color: #9a3050;
      color: #fff;
    }
    nav h2 {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #7a7068;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    nav a {
      display: block;
      color: var(--nav-text);
      text-decoration: none;
      padding: 0.4rem 0;
      border-left: 3px solid transparent;
      padding-left: 0.75rem;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      border-radius: 0 4px 4px 0;
      font-weight: 450;
    }
    nav a:hover {
      color: var(--nav-text-hover);
      background: rgba(255, 255, 255, 0.04);
    }
    nav a.active {
      color: #fff;
      border-left-color: var(--accent-soft);
      background: rgba(90, 21, 40, 0.35);
      font-weight: 500;
    }
    main {
      padding: 0 2rem 4rem;
      max-width: calc(var(--wide) + 4rem);
      background: var(--surface);
      min-height: 100vh;
      box-shadow: -4px 0 24px rgba(20, 16, 13, 0.06);
    }
    .hero {
      padding: 4rem 0 3rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 3rem;
    }
    .hero .eyebrow {
      font-family: var(--sans);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-bright);
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 3.75rem);
      font-weight: 700;
      line-height: 1.1;
      max-width: 18ch;
      color: var(--ink);
    }
    .hero .subtitle {
      margin-top: 1.25rem;
      font-size: 1.35rem;
      color: var(--muted);
      font-style: italic;
      font-weight: 500;
    }
    .hero .meta {
      margin-top: 2rem;
      font-family: var(--sans);
      font-size: 0.85rem;
      color: var(--muted-light);
      font-weight: 450;
    }
    section {
      margin-bottom: 4rem;
      scroll-margin-top: 2rem;
    }
    section > h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--accent);
      letter-spacing: -0.01em;
    }
    section > .lead {
      font-family: var(--sans);
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      max-width: var(--max);
      font-weight: 450;
      line-height: 1.55;
    }
    .prose { max-width: var(--max); }
    .prose p { margin-bottom: 1.1rem; text-align: justify; hyphens: auto; }
    .prose h3 {
      font-size: 1.5rem;
      margin: 2rem 0 0.75rem;
      font-weight: 700;
      color: var(--ink);
    }
    .genealogy {
      background: var(--surface-elevated);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 1.75rem 2rem;
      max-width: var(--wide);
      margin: 1.5rem 0;
      font-size: 1.05rem;
      box-shadow: var(--shadow-sm);
      color: var(--ink);
    }
    .genealogy ol { padding-left: 1.25rem; }
    .genealogy li { margin-bottom: 0.65rem; }
    .genealogy .gen-name { font-weight: 700; color: var(--accent); }
    .family-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      max-width: var(--wide);
      margin: 1.5rem 0;
    }
    .family-card {
      background: var(--surface-elevated);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.15rem;
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .family-card strong {
      display: block;
      color: var(--accent);
      margin-bottom: 0.25rem;
      font-weight: 600;
      font-size: 0.95rem;
    }
    figure {
      margin: 2rem 0;
      max-width: var(--wide);
    }
    figure img {
      width: 100%;
      border-radius: 6px;
      border: 2px solid var(--border-strong);
      cursor: zoom-in;
      background: #fff;
      box-shadow: var(--shadow-md);
    }
    figcaption {
      font-family: var(--sans);
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.75rem;
      text-align: center;
      font-weight: 450;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      max-width: var(--wide);
    }
    .gallery a {
      display: block;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--border);
      aspect-ratio: 3/4;
      background: #fff;
      box-shadow: var(--shadow-sm);
    }
    .gallery a:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .gallery a:hover img { transform: scale(1.03); }
    .note {
      background: var(--accent-soft-bg);
      border: 2px solid var(--accent-soft);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      font-family: var(--sans);
      font-size: 0.9rem;
      border-radius: 0 8px 8px 0;
      max-width: var(--max);
      color: var(--ink);
      font-weight: 450;
      box-shadow: var(--shadow-sm);
    }
    footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 2px solid var(--border);
      font-family: var(--sans);
      font-size: 0.82rem;
      color: var(--muted);
      max-width: var(--max);
      font-weight: 450;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal.open { display: flex; }
    .modal img { max-width: 95vw; max-height: 90vh; border-radius: 4px; }
    .modal button {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #fff;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .tree-root { max-width: var(--wide); overflow-x: auto; }
    .tree-section { margin-bottom: 2.5rem; }
    .tree-heading {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 0.35rem;
    }
    .tree-sublead {
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-weight: 450;
    }
    .tree-ladder {
      background: var(--surface-elevated);
      border-radius: 0 10px 10px 0;
      padding: 1rem 1.25rem 0.5rem 1.5rem;
      border: 2px solid var(--border);
      border-left: 4px solid var(--accent);
      margin-left: 0.5rem;
      box-shadow: var(--shadow-sm);
    }
    .tree-ladder-row {
      display: grid;
      grid-template-columns: 3.5rem 1rem 1fr;
      gap: 0.5rem;
      align-items: start;
      margin-bottom: 0.85rem;
      position: relative;
    }
    .tree-ladder-row--highlight .tree-ladder-person {
      color: var(--accent);
      font-weight: 600;
    }
    .tree-ladder-year {
      font-family: var(--sans);
      font-size: 0.78rem;
      color: var(--muted-light);
      font-weight: 600;
      text-align: right;
      padding-top: 0.15rem;
    }
    .tree-ladder-line {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 0.35rem;
      margin-left: -1.35rem;
    }
    .tree-ladder-person {
      font-size: 1.05rem;
      line-height: 1.45;
      color: var(--ink);
    }
    .tree-ladder-person strong { font-weight: 700; }
    .tree-ladder-spouse {
      display: block;
      font-family: var(--sans);
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .tree-tag {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.72rem;
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      margin-left: 0.35rem;
      vertical-align: middle;
    }
    .tree-tag--d {
      background: #ddd5ca;
      color: var(--muted);
      border: 1px solid var(--border);
      font-weight: 500;
    }
    .tree-siblings {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .tree-card {
      background: var(--surface-elevated);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      position: relative;
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .tree-card--highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md);
    }
    .tree-card--author {
      background: var(--accent-soft-bg);
      border-color: var(--accent);
    }
    .tree-card--deceased {
      background: #e8e2d9;
      border-color: #9a9088;
    }
    .tree-card--deceased .tree-name::after {
      content: " †";
      color: var(--muted);
      font-weight: 400;
    }
    .tree-badge {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: #fff;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-bottom: 0.4rem;
    }
    .tree-name { font-weight: 700; line-height: 1.3; color: var(--ink); }
    .tree-meta {
      font-family: var(--sans);
      font-size: 0.75rem;
      color: var(--muted-light);
      margin-top: 0.25rem;
      font-weight: 450;
    }
    .tree-spouse {
      font-family: var(--sans);
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.35rem;
      padding-top: 0.35rem;
      border-top: 1px dashed var(--border);
    }
    .tree-diagram { overflow-x: auto; padding-bottom: 0.5rem; }
    .tree-branch { display: flex; flex-direction: column; align-items: center; min-width: min-content; }
    .tree-children {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem 1.25rem;
      margin-top: 1rem;
      padding-top: 1rem;
      position: relative;
    }
    .tree-children::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: var(--border-strong);
    }
    .tree-child-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-top: 0.75rem;
    }
    .tree-child-col::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 0.75rem;
      background: var(--border-strong);
      transform: translateX(-50%);
    }
    .tree-section--wide .tree-card { min-width: 150px; max-width: 220px; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      nav {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--nav-border);
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        padding: 1rem;
        box-shadow: var(--shadow-sm);
      }
      .lang-bar { width: 100%; margin-bottom: 0.5rem; padding-bottom: 0.75rem; }
      nav h2 { width: 100%; margin-bottom: 0; }
      nav a { border: none; padding: 0.35rem 0.5rem; }
      nav a.active { background: rgba(90, 21, 40, 0.5); }
      main { padding: 0 1.25rem 3rem; box-shadow: none; }
    }
  </style>
</head>
<body>
<div class="layout">
  <nav>
    <div class="lang-bar">
      <span id="lang-label">Idioma</span>
      <button type="button" data-lang="es" class="active" aria-pressed="true">Español</button>
      <button type="button" data-lang="ca" aria-pressed="false">Català</button>
    </div>
    <h2 id="nav-index">Índice</h2>
    <div id="nav-links"></div>
  </nav>

  <main>
    <header class="hero" id="intro">
      <p class="eyebrow" id="intro-eyebrow"></p>
      <h1 id="intro-h1"></h1>
      <p class="subtitle" id="intro-subtitle"></p>
      <p class="meta" id="intro-meta"></p>
    </header>
    <div id="sections-root"></div>
    <footer id="site-footer"></footer>
  </main>
</div>

<div class="modal" id="modal" role="dialog">
  <button type="button" id="modal-close" aria-label="Cerrar">&times;</button>
  <img src="" alt="">
</div>

<script src="i18n.js"></script>
<script src="tree-data.js"></script>
<script src="tree.js"></script>
<script src="app.js"></script>
</body>
</html>
